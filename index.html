<body>
    <div style="text-align: center; padding: 20px; font-family: sans-serif;">
        <div id="successMark" style="display: none; background: #2ecc71; color: white; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-weight: bold;">
            تمت القراءة بنجاح ✓
        </div>

        <button id="startBtn" onclick="startMeasuring()" style="padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px;">
            ابدأ قياس نبضي الآن 💓
        </button>

        <div style="margin-top: 30px; font-size: 28px;">
            نبضك الحالي: <span id="heartRateText" style="color: #e74c3c; font-weight: bold;">0</span> BPM
        </div>
    </div>

    <video id="v" style="display:none;" playsinline></video>
    <canvas id="c" width="100" height="100" style="display:none;"></canvas>

    <script type="module" src="firebase-config.js"></script>
</body>
