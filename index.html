<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KidLink - Heart Rate</title>
</head>
<body>

    <div style="text-align: center; padding: 20px;">
        <button onclick="startMeasuring()" style="padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px;">
            ابدأ قياس نبضي الحقيقي 💓
        </button>

        <div style="margin-top: 20px; font-size: 24px;">
            النبض الآن: <span id="heartRateText" style="color: red; font-weight: bold;">0</span> BPM
        </div>
    </div>

    <video id="v" style="display:none;" playsinline></video>
    <canvas id="c" width="100" height="100" style="display:none;"></canvas>

    <script type="module" src="firebase-config.js"></script>

</body>
</html>
